name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Тесты
        run: npm test

      - name: Версии совпадают
        run: |
          app=$(grep -oP "APP_VERSION = '\K[^']+" src/app.js)
          pkg=$(node -p "require('./package.json').version")
          echo "app.js: $app, package.json: $pkg"
          test "$app" = "$pkg"
          grep -q "## \[$app\]" CHANGELOG.md

      - name: Сборка сайта
        run: |
          mkdir _site
          cp -r index.html assets src _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
